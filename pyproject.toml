[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oif-collective-intelligence"
version = "0.1.0"
description = "Source-distinct claim aggregation with explicit dissent and quorum reporting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
oif-collective-report = "oif_collective.aggregate:main"

[tool.setuptools.packages.find]
where = ["src"]
